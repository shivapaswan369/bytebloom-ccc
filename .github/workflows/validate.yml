name: Validate ByteBloom
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Extract and syntax-check inline JavaScript
        run: |
          python3 - <<'PY'
          import re
          html = open('index.html', encoding='utf-8').read()
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f'Expected one inline app script, found {len(scripts)}')
          open('/tmp/bytebloom-inline.js', 'w', encoding='utf-8').write(scripts[0])
          PY
          node --check /tmp/bytebloom-inline.js
          node --check question-bank.js
      - name: Validate question data
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          global.window = global;
          require('./question-bank.js');
          const qs = window.BYTEBLOOM_EXTRA_QUESTIONS;
          assert.equal(qs.length, 100, 'expected 100 new questions');
          const chapters = Array.from({length: 10}, (_, i) => qs.filter(q => q.chapter === i));
          chapters.forEach((items, i) => {
            assert.equal(items.length, 10, 'chapter '+(i+1)+' should have 10 new questions');
            assert.equal(items.filter(q => q.difficulty === 'Normal').length, 3);
            assert.equal(items.filter(q => q.difficulty === 'Medium').length, 4);
            assert.equal(items.filter(q => q.difficulty === 'Hard').length, 3);
          });
          const seen = new Set();
          for (const q of qs) {
            assert.equal(q.opts.length, 4, q.en);
            assert.ok(Number.isInteger(q.correct) && q.correct >= 0 && q.correct < 4, q.en);
            assert.ok(q.hi && q.en && q.expHi && q.expEn, q.en);
            assert.equal(q.source, 'Original syllabus-based practice');
            const key = q.en.toLowerCase().replace(/[^a-z0-9]/g, '');
            assert.ok(!seen.has(key), 'duplicate English question: '+q.en);
            seen.add(key);
          }
          console.log('Validated 100 bilingual questions: 10/chapter, 3 Normal + 4 Medium + 3 Hard, four options, answer keys, explanations, unique English prompts.');
          NODE
