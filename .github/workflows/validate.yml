name: Validate ByteBloom
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Extract and syntax-check inline JavaScript
        run: |
          python3 - <<'PY'
          import re
          html = open('index.html', encoding='utf-8').read()
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f'Expected one inline app script, found {len(scripts)}')
          open('/tmp/bytebloom-inline.js', 'w', encoding='utf-8').write(scripts[0])
          PY
          node --check /tmp/bytebloom-inline.js
          node --check question-bank.js
          node --check daily-contest-2026-11-28.js
      - name: Validate question data
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          global.window = global;
          require('./question-bank.js');
          const qs = window.BYTEBLOOM_EXTRA_QUESTIONS;
          assert.equal(qs.length, 100, 'expected 100 new questions');
          const chapters = Array.from({length: 10}, (_, i) => qs.filter(q => q.chapter === i));
          chapters.forEach((items, i) => {
            assert.equal(items.length, 10, 'chapter '+(i+1)+' should have 10 new questions');
            assert.equal(items.filter(q => q.difficulty === 'Normal').length, 3);
            assert.equal(items.filter(q => q.difficulty === 'Medium').length, 4);
            assert.equal(items.filter(q => q.difficulty === 'Hard').length, 3);
          });
          const seen = new Set();
          for (const q of qs) {
            assert.equal(q.opts.length, 4, q.en);
            assert.ok(Number.isInteger(q.correct) && q.correct >= 0 && q.correct < 4, q.en);
            assert.ok(q.hi && q.en && q.expHi && q.expEn, q.en);
            assert.equal(q.source, 'Original syllabus-based practice');
            const key = q.en.toLowerCase().replace(/[^a-z0-9]/g, '');
            assert.ok(!seen.has(key), 'duplicate English question: '+q.en);
            seen.add(key);
          }
          console.log('Validated 100 bilingual questions: 10/chapter, 3 Normal + 4 Medium + 3 Hard, four options, answer keys, explanations, unique English prompts.');
          NODE
      - name: Validate daily contest data
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          global.window = global;
          require('./daily-contest-2026-11-28.js');
          const contest = window.BYTEBLOOM_DAILY_CONTEST;
          assert.equal(contest.date, '28 November 2026');
          assert.equal(contest.questionCount, 25);
          assert.equal(contest.questions.length, 25);
          assert.equal(contest.durationSeconds, 1800);
          assert.equal(contest.pointsPerCorrect, 1);
          assert.equal(contest.negativeMarks, 0);
          assert.equal(contest.chapters.length, 10);
          assert.ok(contest.sourceLabel.includes('Official syllabus practice'));
          assert.ok(contest.sourceLabel.includes('not official exam questions'));
          const expectedChapters = [3,3,3,3,3,2,2,2,2,2];
          const expectedDifficulty = {Easy:8, Moderate:9, 'Exam-level':8};
          const counts = {Easy:0, Moderate:0, 'Exam-level':0};
          const seenIds = new Set(), seenQuestions = new Set();
          contest.questions.forEach(q => {
            assert.ok(q.id && !seenIds.has(q.id), 'duplicate/missing ID');
            seenIds.add(q.id);
            assert.ok(q.chapter >= 0 && q.chapter < 10);
            assert.equal(q.opts.length, 4, q.en);
            assert.ok(Number.isInteger(q.correct) && q.correct >= 0 && q.correct < 4, q.en);
            assert.ok(q.hi && q.en && q.expHi && q.expEn, q.en);
            counts[q.difficulty]++;
            const key = q.en.toLowerCase().replace(/[^a-z0-9]/g, '');
            assert.ok(!seenQuestions.has(key), 'duplicate English prompt: '+q.en);
            seenQuestions.add(key);
          });
          expectedChapters.forEach((count, ch) => assert.equal(contest.questions.filter(q=>q.chapter===ch).length, count, 'chapter '+(ch+1)));
          Object.entries(expectedDifficulty).forEach(([d,n])=>assert.equal(counts[d],n,d));
          console.log('Validated daily contest: 25 bilingual questions, all chapters, balanced difficulty, unique IDs/prompts, 4 options and answer/explanation data.');
          NODE

